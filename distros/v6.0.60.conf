# 凝思 V6.0.60 —— Debian 6 (squeeze) 系，glibc 2.11 档 ABI（上古端）
#
# V6.0 是市场伞号：60 这一支与 100（buster）不同底座。厂商 2023-05 还在重构建
# 这一支（介质日期 20230531），2025-08 仍发 i386 包 —— 老而未死，这正是把它收进
# ABI 阶梯的理由：给「必须兼容极老 glibc」的构建需求一个真实底座。
#
# 锚点如实记：厂商 md5sum.txt 只记 20210709 旧构建，20230531 附 .sign（签名公钥
# 未公开），所以 conf 钉的是官方站直连下载后自算的 sha256，性质记在 .origin。
DID=v6.0.60
DISPLAY_NAME="凝思安全操作系统 V6.0.60"
IMAGE=linx-v6.0.60
FAMILY=deb
METHOD=selfhost

SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:linxos-6.0.60-20230531-x86_64"
SRCDATA_MANIFEST_SHA256="58a86cf11bc712b825f446a309e905c17e4ad85ee30d364f914bd5bf46d0af51"
MEDIA_DIR=lx60
MIRROR=file:///w/media/lx60
NO_CHECK_GPG=yes
ISO_URL="https://www.linx-info.com/download/os/6.0.60/linxos-6.0.60-20230531-x86_64-DVD.iso"
ISO_SHA256=f42b0fa7575ed436ab6e52dae2c9e4596aca7567f54b488bb6db3ca7ec8d2593

SUITE=squeeze
COMPONENTS=main
DEBOOTSTRAP_SCRIPT=/usr/share/debootstrap/scripts/squeeze
USRMERGE=no

PIN_NEVER=""
STAGE1_TOUCH="etc/apt/apt.conf"

STAGE_INCLUDE="apt,apt-utils,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="libc6,libc-bin,libstdc++6,libgcc1,bash,dash,coreutils,dpkg,base-files,base-passwd,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,mawk,hostname,ncurses-base,ncurses-bin,debianutils,login,util-linux,locales"
# squeeze 时代没有 systemd（sysvinit）也没有 iproute2（叫 iproute），照抄新版
# conf 会在切档位时报「依赖未解析」——种子名逐个对过介质 pkglist
BASE_INCLUDE="iproute,iputils-ping,vim-tiny,lsof,unzip,apt,apt-utils,gpgv,passwd,adduser,python3,curl,procps,less,file,xz-utils,sysvinit,dbus"
DEVEL_INCLUDE="gcc,make,libc6-dev,g++,libstdc++6-4.4-dev,binutils,dpkg-dev"

# 基线：libc6 2.11.3-4+deb6u11linx1；gcc-4.4.5 → libstdc++.so.6.0.13（GLIBCXX ≤ 3.4.13）
EXPECT_GLIBC=2.11
EXPECT_LIBSTDCPP=6.0.13
EXPECT_GLIBCXX=3.4.13
EXPECT_CXX=yes
EXPECT_SHADOW=0:42/660            # 凝思全系收紧到 660（与 6.0.100 一致，实测）

# gpgkeys_ldap 链 libldap 而厂商介质不带它（gnupg 的可选 keyserver helper）；
# /etc/nologin 悬空链是 squeeze 世代 sysvinit 的惰性残留 —— 都是厂商介质原样
ELF_BROKEN_OK="gpgkeys_ldap"
DANGLING_ETC_OK="nologin"

# 介质 dists/squeeze/Release 的 Date（2023-05-31），与数据镜像 .epoch 同源
SOURCE_DATE_EPOCH=1685523900
