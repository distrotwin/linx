# 凝思 V6.0.99（el24.03）—— openEuler 24.03 系底座，glibc 2.38 档 ABI，双架构
#
# rpm 系。6.0.99 有 el20.03/el22.03/el24.03 三个欧拉支，收 el24.03：ABI 最高
# （2.38，全 org 阶梯的天花板），且是凝思各支里唯一被系统化打补丁的（CSAF 472 条）。
#
# 如实标注：这盘介质 198/213 个包连签名 tag 都没有（含 bash/glibc），逐包 GPG
# 验签不可用，完整性锚点是 ISO 官方校验和 + repodata 逐包 sha256
#（NO_RPM_SIG=iso-anchored，详见数据镜像 .origin）。
DID=v6.0.99
DISPLAY_NAME="凝思安全操作系统 V6.0.99（el24.03）"
IMAGE=linx-v6.0.99
FAMILY=rpm
METHOD=rpmmedia

case $ARCH in
  amd64)
    SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:linxos-6.0.99-el24.03-20241029-x86_64"
    SRCDATA_MANIFEST_SHA256="e7e3b17f4c65a15bbe10c24af26c752eae6c23ff1f0e9a4e096243aa7b0be1fe"
    MEDIA_DIR=lx99-x86_64
    ISO_URL="https://www.linx-info.com/download/os/6.0.99/el24.03/linxos-6.0.99-el24.03-20241029-x86_64-BD.iso"
    ISO_MD5=b0d03f7fef33c846799765d763a4b244
    ;;
  arm64)
    SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:linxos-6.0.99-el24.03-20241029-arm64"
    SRCDATA_MANIFEST_SHA256="849e5cd46ab921dcef5e9d14f6b992c3566ec7767f302fd22f6d84be688ef0cf"
    MEDIA_DIR=lx99-aarch64
    ISO_URL="https://www.linx-info.com/download/os/6.0.99/el24.03/linxos-6.0.99-el24.03-20241029-arm64-BD.iso"
    ISO_MD5=1b0ba903bcae25096654bebeb1899ec2
    ;;
esac

USRMERGE=yes
RPM_DB_BACKEND=ndb                # rpm 4.18.2 认 ndb，宿主也能写（kylinsec v6 同款）

SLICE_MICRO="filesystem,setup,basesystem,glibc,glibc-common,glibc-all-langpacks,bash,coreutils,rpm,rpm-libs,ca-certificates,tzdata,sed,grep,tar,gzip,findutils,diffutils,gawk,hostname,ncurses-base,ncurses-libs,shadow,util-linux,libgcc,libstdc++,zlib,openssl-libs,chkconfig"
SLICE_BASE_EXTRA="iproute,iputils,vim-minimal,lsof,unzip,dnf,dnf-data,python3,curl,procps-ng,less,file,xz,systemd,dbus"
SLICE_DEVEL_EXTRA="gcc,gcc-c++,make,glibc-devel,libstdc++-devel,binutils,rpm-build,cpp,pkgconf"

# 基线：glibc 2.38-29；gcc 12.3.1 → libstdc++.so.6.0.30（GLIBCXX ≤ 3.4.30）
EXPECT_GLIBC=2.38
EXPECT_LIBSTDCPP=6.0.30
EXPECT_GLIBCXX=3.4.30
EXPECT_CXX=yes
EXPECT_SHADOW=0:0/0
