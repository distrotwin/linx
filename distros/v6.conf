# 凝思安全操作系统 V6.0.100 —— Debian 10 (buster) 系，glibc 2.28 档 ABI
#
# 取材走数据镜像而不是在线源：凝思只有 ISO 一条公开获取路径，而它的下载站对
# GitHub hosted runner 全量超时（本机直连 200/0.07s，runner 000/135s，阴性对照
# 同超时，判据与探测记录见 buildkit docs/downstream-repo.md）。所以介质在本机
# 从官方 ISO 切出依赖闭包，推成 ghcr.io/distrotwin/scratch 的数据镜像，构建时
# 取回并逐文件验 manifest。ISO 本体的完整性锚点见下面 ISO_* 三项与数据镜像内
# 的 .origin。
DID=v6
DISPLAY_NAME="凝思安全操作系统 V6.0.100"
IMAGE=linx-v6
FAMILY=deb
METHOD=selfhost                   # 与银河麒麟同路：两阶段 debootstrap。凝思的
                                  # linx_administrator 会在 dpkg 钩子里挂死普通
                                  # mmdebstrap（实测钩子进程 13 分钟不退出），
                                  # selfhost + PIN_NEVER 从入口把它拦掉。

SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:linxos-6.0.100-20230822-x86_64"
SRCDATA_MANIFEST_SHA256="a38daa1c546c96b61ae28d6c860d41450f1af5c143ee5a61d25e5a9a7f87999d"
MEDIA_DIR=lx
MIRROR=file:///w/media/lx
NO_CHECK_GPG=yes                  # 介质仓库无签名；完整性由 ISO 官方校验和 +
                                  # 数据镜像 manifest 两道门禁兜底
# 厂商发布的 ISO 锚点（官方 md5sum.txt 实测逐位一致），数据镜像 .origin 同记
ISO_URL="https://www.linx-info.com/download/os/6.0.100/x86_64/linxos-6.0.100-20230822-x86_64-DVD.iso"
ISO_MD5=851468218404d48356ff2e2112a0933d
ISO_SHA256=4b061ff06650df59f3cd37544c9c43a44ff7decb5a1255fe836561a9cdfc7fe0

SUITE=buster
COMPONENTS=main
DEBOOTSTRAP_SCRIPT=/usr/share/debootstrap/scripts/buster
USRMERGE=no

# linx-noroot-conf 装的是三权分立管理钩子（exec-after-dpkg.sh），容器构建里它
# 会挂死 dpkg；内核包在容器镜像里没有意义。
PIN_NEVER="linx-noroot-conf initramfs-tools linux-image-4.19.0-11-linx-security-amd64-unsigned"

STAGE_INCLUDE="apt,apt-utils,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="libc6,libc-bin,libstdc++6,libgcc1,bash,dash,coreutils,dpkg,base-files,base-passwd,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,mawk,hostname,ncurses-base,ncurses-bin,debianutils,login,util-linux,locales"
BASE_INCLUDE="iproute2,iputils-ping,vim-tiny,lsof,unzip,apt,apt-utils,gpgv,passwd,adduser,python3,curl,procps,less,file,xz-utils,systemd,systemd-sysv,dbus"
DEVEL_INCLUDE="gcc,make,libc6-dev,g++,libstdc++-8-dev,binutils,dpkg-dev"

# 基线为实测：libstdc++.so.6.0.25 最高 GLIBCXX_3.4.25（Debian 10 的 gcc-8 档）
EXPECT_GLIBC=2.28
EXPECT_LIBSTDCPP=6.0.25
EXPECT_GLIBCXX=3.4.25
EXPECT_CXX=yes
EXPECT_SHADOW=0:42/660            # 凝思收紧到 660（Debian 默认 640），实测值

# 介质 dists/buster/Release 的 Date（2023-08-22），与数据镜像 .epoch 同源
SOURCE_DATE_EPOCH=1692681574
