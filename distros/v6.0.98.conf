# 凝思 V6.0.98（an8）—— Anolis 8 / EL8 系底座，glibc 2.28 档 ABI，双架构
#
# rpm 系（an8）。介质为 BaseOS+AppStream 双仓 DVD。厂商带 .lx*.linx98 标记的
# 重构包（glibc/systemd/util-linux 等 26 个）一律未签名，Anolis 继承包全部过
# 验签；放行名单与锚点记录在数据镜像 .origin。
DID=v6.0.98
DISPLAY_NAME="凝思安全操作系统 V6.0.98（an8）"
IMAGE=linx-v6.0.98
FAMILY=rpm
METHOD=rpmmedia

case $ARCH in
  amd64)
    SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:linxos-6.0.98-an8-20240730-x86_64"
    SRCDATA_MANIFEST_SHA256="6af653a8226edad60b1f7f2fd3bcd5fcf7163c6692c841f0b8661536d0ccfd02"
    MEDIA_DIR=lx98-x86_64
    ISO_URL="https://www.linx-info.com/download/os/6.0.98/x86_64/linxos-6.0.98-an8-20240730-x86_64-DVD.iso"
    ISO_MD5=b4879e2f087a1db972915645b6cfc13a
    ;;
  arm64)
    SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:linxos-6.0.98-an8-20250205-arm64"
    SRCDATA_MANIFEST_SHA256="f7a01e9ee5fa670637e327749b84ed5241e0d962694dcd6a580c0b3ebda00856"
    MEDIA_DIR=lx98-aarch64
    ISO_URL="https://www.linx-info.com/download/os/6.0.98/arm64/linxos-6.0.98-an8-20250205-arm64-DVD.iso"
    ISO_MD5=ae2639354e84ca39960b28177bc9466b
    ;;
esac

RPM_KEY=keys/RPM-GPG-KEY-LINXOS
RPM_KEY_FP=F87DB6522967855E986F840C619140084873F7C5
USRMERGE=yes                      # EL8 世代 merged-usr
RPM_DB_BACKEND=
RPM_DB_VIA_TARGET=yes             # rpm 4.14.3：与 kylinsec v3.4 同策略，包登记交目标重做

SLICE_MICRO="filesystem,setup,basesystem,glibc,glibc-common,glibc-all-langpacks,bash,coreutils,rpm,rpm-libs,ca-certificates,tzdata,sed,grep,tar,gzip,findutils,diffutils,gawk,hostname,ncurses-base,ncurses-libs,shadow-utils,util-linux,libgcc,libstdc++,zlib,openssl-libs,chkconfig"
SLICE_BASE_EXTRA="iproute,iputils,vim-minimal,lsof,unzip,dnf,dnf-data,python36,curl,procps-ng,less,file,xz,systemd,dbus"
SLICE_DEVEL_EXTRA="gcc,gcc-c++,make,glibc-devel,libstdc++-devel,binutils,rpm-build,cpp,pkgconf-pkg-config"

# 基线：glibc 2.28-189（lx 重构）；gcc 8.5.0 → libstdc++.so.6.0.25（GLIBCXX ≤ 3.4.25）
EXPECT_GLIBC=2.28
EXPECT_LIBSTDCPP=6.0.25
EXPECT_GLIBCXX=3.4.25
EXPECT_CXX=yes
EXPECT_SHADOW=0:0/0
