# 凝思磐石 V6.0.42（Rocky 4.2）—— 自研底座，glibc 2.5 / gcc 4.1.2（上古端）
#
# 身份如实记：/etc/linx-release 自述 "Rocky 4.2"（凝思磐石产品线），包管理是
# 自研的 pkgutils 式 /var/lib/pkg/db（无依赖字段），既非 deb 也非 rpm。厂商
# 2025-09 还在重构建这一支。收进阶梯的理由：全 org 最老的真实 ABI 地板
# （GLIBC_2.2.5 符号天花板实测），给「必须兼容极老 glibc」的构建需求一个真底座。
#
# ISO 是整盘摊开的 rootfs（没有软件仓库），取材按 pkg db + ELF NEEDED 算闭包
# 裁到 45 包超集（403 MB）。裁掉的仅数据类文件（全量 locale 留 zh_CN/en_US/C、
# libgcj、python3.9/test、doc/info/man/dict），清单记在数据镜像 .origin。
# /etc/os-release 为容器化合成（该世代早于该规范），文件头有注明。
DID=v6.0.42
DISPLAY_NAME="凝思磐石 V6.0.42（Rocky 4.2）"
IMAGE=linx-v6.0.42
FAMILY=raw
METHOD=pkgslice

SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:linxos-v6.0.42-20250925-x86_64"
SRCDATA_MANIFEST_SHA256="4bf3cd126c359b8f59e2eb01bc94d5d1b97aad3c6cc808602a10b3b6290f7f2e"
MEDIA_DIR=lx42
ISO_URL="https://www.linx-info.com/download/os/6.0.42/linxos-v6.0.42-20250925-x86_64.iso"
ISO_MD5=8ac4d37f20ed59f27cd6b97a0ea4c8ac

USRMERGE=no

SLICE_MICRO="filesystem,glibc,bash,coreutils,sed,grep,tar,gzip,findutils,diffutils,gawk,ncurses,readline,zlib,shadow,util-linux,less,which,file"
SLICE_BASE_EXTRA="iproute2,procps,net-tools,vim,unzip,lsof,python3,openssl,e2fsprogs"
SLICE_DEVEL_EXTRA="gcc,binutils,make,gmp,mpfr,patch,perl,kernel-header"

# 基线：glibc 2.5（libc-2.5.so 实测）；gcc 4.1.2 → libstdc++.so.6.0.8（GLIBCXX ≤ 3.4.8）
EXPECT_GLIBC=2.5
EXPECT_LIBSTDCPP=6.0.8
EXPECT_GLIBCXX=3.4.8
EXPECT_CXX=yes
EXPECT_SHADOW=0:0/444        # 磐石世代 shadow 是 444（实测介质原样）
