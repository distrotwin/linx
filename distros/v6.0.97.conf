# 凝思 V6.0.97（an7）—— Anolis 7 / EL7 系底座，glibc 2.17 档 ABI
#
# V6.0 是市场伞号：97 这一支是 rpm 系（an7 = Anolis 7 兼容），与 deb 主线不同宗。
# 介质为官方 BD 盘（9.2 GB），取材时按依赖闭包裁到 137 MB 推数据镜像。
# 介质内含厂商签名 key（linxos-gpg-keys 包），除 4 个厂商自有包外全部过验签，
# 放行名单与锚点记录在数据镜像 .origin。
DID=v6.0.97
DISPLAY_NAME="凝思安全操作系统 V6.0.97（an7）"
IMAGE=linx-v6.0.97
FAMILY=rpm
METHOD=rpmmedia

SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:linxos-6.0.97-an7-x86_64"
SRCDATA_MANIFEST_SHA256="c1565a86469019fb2088bd97c1701fdaf128d122b72041f69a6f9b0c3f36508d"
MEDIA_DIR=lx97
ISO_URL="https://www.linx-info.com/download/os/6.0.97/x86_64/linxos-6.0.97-an7-x86_64-BD.iso"
ISO_MD5=141557eb5543b33a54223a2d523edf02

RPM_KEY=keys/RPM-GPG-KEY-LINX
RPM_KEY_FP=F87DB6522967855E986F840C619140084873F7C5
USRMERGE=no
RPM_DB_BACKEND=
RPM_DB_VIA_TARGET=yes             # rpm 4.11.3 只认 bdb，builder 的 4.20 写不了 bdb
                                  # —— 文件宿主落位、包登记交目标自己的 rpm 重做

SLICE_MICRO="filesystem,setup,basesystem,glibc,glibc-common,bash,coreutils,rpm,rpm-libs,ca-certificates,tzdata,sed,grep,tar,gzip,findutils,diffutils,gawk,hostname,ncurses-base,ncurses-libs,shadow-utils,util-linux,libgcc,libstdc++,zlib,openssl-libs,chkconfig"
SLICE_BASE_EXTRA="iproute,iputils,vim-minimal,lsof,unzip,yum,python3,curl,procps-ng,less,file,xz,systemd,dbus"
SLICE_DEVEL_EXTRA="gcc,gcc-c++,make,glibc-devel,libstdc++-devel,binutils,rpm-build,cpp,pkgconfig"

# 基线：glibc 2.17-323（EL7）；gcc 4.8.5 → libstdc++.so.6.0.19（GLIBCXX ≤ 3.4.19）
EXPECT_GLIBC=2.17
EXPECT_LIBSTDCPP=6.0.19
EXPECT_GLIBCXX=3.4.19
EXPECT_CXX=yes
EXPECT_SHADOW=0:0/0
